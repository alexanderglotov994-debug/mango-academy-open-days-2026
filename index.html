<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Манго Академия — хронология сайта</title><link rel="icon" href="assets/ma-logo-yellow.png"><style>
*{box-sizing:border-box}body{margin:0;background:#e9e9e5;color:#252b29;font:13px 'Segoe UI',sans-serif}.desk{height:166px;padding:16px 28px 10px}.head{display:flex;align-items:center;justify-content:space-between;gap:15px}.head strong{font-size:15px}.head small{color:#696d68;margin-left:14px}.tools{display:flex;gap:16px;align-items:center}.tools a{color:#444b44;text-decoration:none}.status{font-size:11px;text-transform:uppercase;letter-spacing:1px;background:#e6e8b1;border-radius:30px;padding:6px 10px}.timeline{display:flex;gap:7px;overflow-x:auto;margin-top:16px;padding-bottom:7px;scrollbar-width:thin}.group{flex:1;min-width:max-content}.group>span{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;display:block;color:#616960;margin-bottom:7px}.days{display:flex;gap:4px}.day{border:1px solid #d0d3cc;background:#f5f6f1;color:#495046;border-radius:8px;padding:8px 0;width:44px;cursor:pointer;font:inherit;position:relative}.day small{font-size:9px;display:block;margin-top:2px;color:#80877c}.day.active{background:#455b62;border-color:#455b62;color:white;box-shadow:0 3px 8px #23382b22}.day.active small{color:#c3d2c6}.day:hover{border-color:#324f3d}.hint{font-size:11px;color:#6e746d;margin:5px 0}.preview{margin:0 16px 14px;border:1px solid #d5d8cf;border-radius:16px;overflow:hidden;height:calc(100dvh - 180px);background:#faf9f5;box-shadow:0 8px 32px #29382b0a}iframe{display:block;width:100%;height:100%;border:0}button:focus-visible,a:focus-visible{outline:3px solid #949c21;outline-offset:3px}@media(max-width:650px){.desk{padding:12px 14px;height:158px}.head small,.tools a{display:none}.head strong{font-size:13px}.status{font-size:9px}.preview{margin:0 6px 6px;height:calc(100dvh - 164px);border-radius:12px}.timeline{margin-top:12px}.day{width:40px}.tools{gap:5px}}
</style></head><body><div class="desk"><div class="head"><div><strong>Манго Академия</strong><small>Дни открытых дверей / декабрь 2026</small></div><div class="tools"><span class="status">Просмотр по дням</span><a id="standalone" href="site.html?day=2026-12-09" target="_blank" rel="noopener">Открыть только сайт ↗</a></div></div><nav class="timeline" aria-label="Хронология состояний сайта"></nav><p class="hint" id="hint" aria-live="polite"></p></div><div class="preview"><iframe title="Сайт Манго Академии — выбранный день" id="site"></iframe></div><script>
const groups=[['01 / Интрига',['2026-11-30']],['02 / Досье Академии',[1,2,3,4,7,8].map(d=>`2026-12-${String(d).padStart(2,'0')}`)],['03 / Знакомство и программа',[9,10,11,14,15].map(d=>`2026-12-${String(d).padStart(2,'0')}`)],['04 / Встречаемся',['2026-12-16','2026-12-17','2026-12-18']],['05 / После',['2026-12-21']]];const dates=groups.flatMap(g=>g[1]);const requested=new URLSearchParams(location.search).get('day');let current=dates.includes(requested)?requested:'2026-12-09';
document.querySelector('.timeline').innerHTML=groups.map(([name,days])=>`<div class="group"><span>${name}</span><div class="days">${days.map(d=>`<button class="day" data-day="${d}" aria-label="${new Date(d+'T12:00:00+03:00').toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'})}">${d.slice(-2)}<small>${d.includes('-11-')?'ноя':'дек'}</small></button>`).join('')}</div></div>`).join('');
function select(day,scroll=false){current=day;document.querySelectorAll('.day').forEach(b=>{const active=b.dataset.day===day;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active);if(active&&scroll)b.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})});document.querySelector('#site').src='site.html?v=calendar1&day='+day;document.querySelector('#standalone').href='site.html?v=calendar1&day='+day;const stage=day<'2026-12-01'?'Тизер':day<'2026-12-09'?'Досье Академии':day<'2026-12-16'?'Знакомство и программа':day<'2026-12-19'?'Дни мероприятия':'Итоги и материалы';document.querySelector('#hint').textContent=stage+' · Выберите день, чтобы увидеть, как меняется сайт. Даты на этой линии — режим просмотра.';history.replaceState(null,'','?day='+day)}document.querySelector('.timeline').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(b)select(b.dataset.day)});select(current);
</script></body></html>
